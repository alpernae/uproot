<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Uproot: a sprout lifted clear of the soil, roots and all. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4ad9a1"/>
      <stop offset="1" stop-color="#178a5f"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.3" cy="0.12" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#sheen)"/>
  <rect x="9" y="9" width="238" height="238" rx="55" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>

  <g fill="#052a1b" stroke="#052a1b" stroke-linecap="round" stroke-linejoin="round">
    <!-- leaves -->
    <path stroke="none" d="M128 108 C128 78 106 60 70 60 C70 92 92 108 128 108 Z"/>
    <path stroke="none" d="M128 96 C128 60 154 40 194 40 C194 78 168 96 128 96 Z"/>
    <!-- stem -->
    <path fill="none" stroke-width="16" d="M128 106 V160"/>
    <!-- roots -->
    <path fill="none" stroke-width="10" d="M128 156 C128 174 112 178 98 190"/>
    <path fill="none" stroke-width="10" d="M128 156 C128 174 144 178 158 190"/>
    <path fill="none" stroke-width="10" d="M128 156 V196"/>
  </g>

  <!-- the soil it was pulled from -->
  <rect x="62" y="208" width="132" height="14" rx="7" fill="#052a1b" fill-opacity="0.38"/>
</svg>
